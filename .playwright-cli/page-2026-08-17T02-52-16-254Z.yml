          - heading "Version 2 research note" [level=2] [ref=f1e70]
          - list [ref=f1e71]:
            - listitem [ref=f1e72]: Keep the object footprint rigid instead of moving its corners independently.
            - listitem [ref=f1e73]: Hold one edge as a hinge and rotate the opposite edge toward the terrain.
            - listitem [ref=f1e74]: Search a single angle for the smallest combined placement error.
            - listitem [ref=f1e75]: Accept the best rigid compromise when uneven terrain prevents a perfect fit.
        - heading "Conform without deforming" [level=2] [ref=f1e76]
        - paragraph [ref=f1e77]: One of the fitting problems under consideration for LandSnap Version 2 is how to settle a wide object against uneven terrain without bending its footprint.
        - paragraph [ref=f1e78]: Snapping every corner to a separate terrain hit can force contact, but it also deforms the shape. That is not a valid result for a rigid prop, platform, foundation, or modular building piece.
        - paragraph [ref=f1e79]:
          - text: The cleaner model gives the object only one degree of freedom. Two footprint vertices,
          - code [ref=f1e80]: A
          - text: and
          - code [ref=f1e81]: B
          - text: ", define a fixed hinge axis. The remaining vertices,"
          - code [ref=f1e82]: C
          - text: and
          - code [ref=f1e83]: D
          - text: ", rotate around that axis together, so every edge length and angle in the footprint is preserved."
        - code [ref=f1e85]: u = (B - A) / ||B - A||
        - paragraph [ref=f1e86]: "At each candidate hinge angle, LandSnap rotates the two free vertices and raycasts down to the terrain beneath them. Their height errors are combined into one score:"
        - code [ref=f1e88]: E(theta) = e_C(theta)^2 + e_D(theta)^2
        - paragraph [ref=f1e89]: The desired rotation is simply the angle that produces the smallest score. Squaring the two errors prevents a corner above the terrain from canceling out one below it, and it makes a large miss more expensive than two small ones.
        - heading "A small, practical search" [level=2] [ref=f1e90]
        - paragraph [ref=f1e91]: Terrain is triangulated, so the surface beneath a rotating corner can change during the fit. That makes the error piecewise-defined and rules out relying on one globally valid closed-form angle.
        - paragraph [ref=f1e92]: "The practical solver is still tiny:"
        - list [ref=f1e93]:
          - listitem [ref=f1e94]: Limit the hinge to a safe rotation range.
          - listitem [ref=f1e95]: Sample that range coarsely to find the best local bracket.
          - listitem [ref=f1e96]: Refine the bracket with a short one-dimensional search.
          - listitem [ref=f1e97]: Apply the winning angle as one rigid rotation.
        - paragraph [ref=f1e98]: A ternary or golden-section refinement can converge in only a handful of iterations when the selected bracket is locally smooth. The initial coarse pass matters because triangle changes, holes, and competing surface features can create more than one local minimum.
        - paragraph [ref=f1e99]: "For steep terrain, the same fit can measure each corner against the triangle plane instead of comparing only world height:"
        - code [ref=f1e101]: e(P, theta) = n . (P(theta) - T)
        - paragraph [ref=f1e102]:
          - text: Here,
          - code [ref=f1e103]: "n"
          - text: is the normalized triangle normal and
          - code [ref=f1e104]: T
          - text: is the terrain hit point. This measures separation along the surface normal and should produce a more natural result on strong slopes.
        - heading "The useful limitation" [level=2] [ref=f1e105]
        - paragraph [ref=f1e106]: One hinge angle normally cannot make both free corners touch arbitrary terrain exactly. That is not a failure of the solver; it is the unavoidable constraint that keeps the object rigid.
        - paragraph [ref=f1e107]: "LandSnap is finding the best compromise:"
        - code [ref=f1e109]: e_C^2 + e_D^2 -> minimum
        - paragraph [ref=f1e110]: If the placement contract allows the hinge itself to move, a small final suspension offset can remove the average remaining vertical error. If the hinge points are hard anchors, that translation stays disabled.
        - paragraph [ref=f1e111]: "That is the Version 2 idea in one sentence: let the terrain choose the best rigid orientation, but never let it deform the asset to get there."
